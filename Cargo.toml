[workspace]
resolver = "2"
members = ["crates/chemgp-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
faer = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_distr = "0.5"
chemfiles = "0.10"
readcon-core = "=0.14.7"
approx = "0.5"
rgpot-core = { version = "=3.0.2", git = "https://github.com/OmniPotentRPC/rgpot", rev = "473033de21a26dc25adb73df3b3640eed0dc0074", features = ["rpc"] }
dlpk = "0.1"
clap = { version = "4", features = ["derive", "env"] }
